<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f1df">
  <meta name="description" content="紙のノートで、自分らしい家庭学習を始めるための小学生向け自学サポート">
  <title>自学サポート</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <a class="skip-link" href="#app">本文へ</a>
  <header class="site-header">
    <button class="brand" type="button" data-route="home" aria-label="自学サポートのホームへ">
      <span class="brand-mark" aria-hidden="true">ノ</span>
      <span><strong>自学サポート</strong><small>ノートで学ぶ力を育てよう</small></span>
    </button>
    <nav class="header-actions" aria-label="共通メニュー">
      <label class="grade-picker">
        <span>学年</span>
        <select id="header-grade" aria-label="学年を選ぶ">
          <option value="1">1年</option>
          <option value="2">2年</option>
          <option value="3">3年</option>
          <option value="4">4年</option>
          <option value="5">5年</option>
          <option value="6">6年</option>
        </select>
      </label>
      <button class="home-button" type="button" data-route="home">⌂ ホーム</button>
    </nav>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer>
    <span>短くても、自分で考えて「分かった！」が増えれば、いい自学。</span>
    <span>記録はこの端末だけに保存されます。</span>
  </footer>

  <template id="modal-template">
    <div class="modal-backdrop" role="presentation">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" aria-label="閉じる">×</button>
        <div class="modal-content"></div>
      </section>
    </div>
  </template>

  <noscript><p class="noscript">このアプリを使うにはJavaScriptを有効にしてください。</p></noscript>
  <script>
    (() => {
      const select = document.querySelector('#header-grade');
      const key = 'edu:jigaku-coach-v1:settings';
      if (!select) return;
      try {
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        const grade = Number(saved.grade);
        if (grade >= 1 && grade <= 6) select.value = String(grade);
      } catch {}
      select.addEventListener('change', () => {
        const grade = Number(select.value);
        try {
          const saved = JSON.parse(localStorage.getItem(key) || '{}');
          localStorage.setItem(key, JSON.stringify({ ...saved, grade }));
        } catch {}
        window.location.reload();
      });
    })();
  </script>
  <script type="module" src="app.js?v=6"></script>
</body>
</html>
